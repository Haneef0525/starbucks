<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbucks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ====== NAVBAR ====== -->
  <nav>
    <div class="leftside">
      <img src="https://upload.wikimedia.org/wikipedia/sco/d/d3/Starbucks_Corporation_Logo_2011.svg" alt="logo">
      <a href="#">Home</a>
      <a href="#">Gift</a>
      <a href="#">Order</a>
      <a href="#">Pay</a>
      <a href="#">Store</a>
      
    </div>
    <div class="rightside">
      <input type="search" id="search-bar" placeholder="Looking for something specific?">
      <img src="account_thin.svg" alt="account">
    </div>
  </nav>

  <!-- ====== GREEN HEADER ====== -->
  <div class="second">
    <h4 class="head">Starbucks</h4>
    <button type="button">Know More</button>
  </div>

  <!-- ====== PROMO CARD ====== -->
  <section class="third">
    <div class="promo-card">
      <img class="promo-img" src="BEVERAGE_APP_1_4a3a05b636.png">
      <div class="promo-content">
        <p class="tag">#Unboxyourday</p>
        <h2>Starbucks Rewards Day!</h2>
        <p>Get a limited-edition Bento Box free with spends of ₹900 or more, exclusively for Starbucks Rewards members.</p>
        <button class="readmore">Read more</button>
      </div>
    </div>
  </section>

  <!-- ====== HANDCRAFTED CURATIONS ====== -->
  <section class="fifth">
    <h3>Handcrafted Curations</h3>
    <div class="on-container">
      <div class="on">
        <img src="ReadyToEat.webp" alt="">
        <a href="#">New</a>
      </div>
      <div class="on">
        <img src="Bestseller.jpg" alt="">
        <a href="#">Bestseller</a>
      </div>
      <div class="on">
        <img src="Drinks.jpg" alt="">
        <a href="#">Drinks</a>
      </div>
      <div class="on">
        <img src="Food.jpg" alt="">
        <a href="#">Food</a>
      </div>
      <div class="on">
        <img src="Merchandise.jpg" alt="">
        <a href="#">Merchandise</a>
      </div>
      <div class="on">
        <img src="CoffeeAtHome.jpg" alt="">
        <a href="#">Coffee At Home</a>
      </div>
    </div>
  </section>
</body>
</html>
